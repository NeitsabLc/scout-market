name: Synchroniser le miroir GitLab SGDF

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miroir-gitlab
  cancel-in-progress: false

jobs:
  miroir:
    name: Pousser main et les tags vers GitLab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer l'historique complet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pousser vers le dépôt GitLab
        env:
          GITLAB_MIRROR_SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
          GITLAB_MIRROR_URL: git@gitlab.com:sgdf/projets-benevoles/scout-market.git
          # Clé d'hôte publiée par GitLab (empreinte SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8)
          GITLAB_HOST_KEY: gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf
        run: |
          test -n "$GITLAB_MIRROR_SSH_KEY"
          ssh_dir="$RUNNER_TEMP/miroir-gitlab"
          trap 'rm -rf "$ssh_dir"' EXIT
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$GITLAB_MIRROR_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          printf '%s\n' "$GITLAB_HOST_KEY" > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git push "$GITLAB_MIRROR_URL" refs/remotes/origin/main:refs/heads/main 'refs/tags/v*:refs/tags/v*'
