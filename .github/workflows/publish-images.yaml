name: Publication des images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publication-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier-candidat:
    name: Publier le candidat ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: php, file: docker/php/Dockerfile, target: php-production }
          - { image: nginx, file: docker/php/Dockerfile, target: nginx-production }
          - { image: postgres, file: docker/postgres/Dockerfile, target: postgres-runtime }
          - { image: liquibase, file: docker/liquibase/Dockerfile, target: liquibase-runtime }
          - { image: backup, file: docker/postgres/Dockerfile, target: backup-runtime }

    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir le nom et l'etiquette immuable
        shell: bash
        run: |
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          echo "REGISTRY_IMAGE=ghcr.io/${proprietaire}/scout-market-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Se connecter a GHCR
        env: { GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Construire et publier le candidat avec SBOM et provenance
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=publication-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=publication-${{ matrix.image }}

      - name: Valider le digest construit
        env: { IMAGE_DIGEST: "${{ steps.build.outputs.digest }}" }
        run: printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'

      - name: Signer le candidat avec Sigstore
        env: { IMAGE_DIGEST: "${{ steps.build.outputs.digest }}" }
        run: cosign sign --yes "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"

  tester-candidats:
    name: Tester les images candidates
    if: github.ref == 'refs/heads/main'
    needs: publier-candidat
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Se connecter a GHCR
        env: { GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resoudre les cinq digests candidats
        shell: bash
        run: |
          . ./scripts/registry-helpers.sh
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          for image in $(release_image_names); do
            depot="ghcr.io/${proprietaire}/scout-market-${image}"
            digest=$(registry_resolve_digest_with_retry "${depot}:sha-${GITHUB_SHA}")
            variable="SCOUT_RELEASE_${image^^}_IMAGE"
            echo "${variable}=${depot}@${digest}" >> "$GITHUB_ENV"
          done
          echo "SCOUT_RELEASE_GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Verifier les signatures Sigstore
        run: ./scripts/verify-release-images.sh

      - name: Preparer la configuration isolee
        run: ./scripts/ci-prepare-env.sh

      - name: Tester exactement les images candidates
        env:
          COMPOSE_PROJECT_NAME: scout-market-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          NGINX_HOST_PORT: 18082
          POSTGRES_HOST_PORT: 15436
          USE_RELEASE_IMAGES: "1"
        run: |
          export SMOKE_BACKUP_IMAGE="$SCOUT_RELEASE_BACKUP_IMAGE"
          export SMOKE_POSTGRES_IMAGE="$SCOUT_RELEASE_POSTGRES_IMAGE"
          ./scripts/ci-production-smoke.sh

  valider-tag:
    name: Valider la version a promouvoir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Recuperer l'historique Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - name: Verifier le tag et son appartenance a main
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          objet_tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          test "$(jq -r '.object.type' <<<"$objet_tag")" = tag || {
            echo "Le tag de release doit etre annote et signe." >&2; exit 1;
          }
          signature_valide=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r '.object.sha' <<<"$objet_tag")" --jq '.verification.verified')
          test "$signature_valide" = true

      - name: Attendre la validation des images candidates
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          for tentative in $(seq 1 54); do
            etat=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-images.yaml/runs" \
              -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -f per_page=10 \
              --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "absent" elif .status != "completed" then .status else .conclusion end') || etat=indisponible
            case "$etat" in
              success) exit 0 ;;
              absent|indisponible|queued|in_progress|pending|requested|waiting)
                [ "$tentative" -eq 54 ] || sleep 10 ;;
              *) echo "La publication candidate a termine avec l'etat ${etat}." >&2; exit 1 ;;
            esac
          done
          echo "Validation candidate indisponible apres 9 minutes pour ${GITHUB_SHA}." >&2
          exit 1

  promouvoir-version:
    name: Promouvoir ${{ matrix.image }} sans reconstruire
    if: startsWith(github.ref, 'refs/tags/v')
    needs: valider-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: { image: [php, nginx, postgres, liquibase, backup] }
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir les references
        shell: bash
        run: |
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          echo "REGISTRY_IMAGE=ghcr.io/${proprietaire}/scout-market-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Se connecter a GHCR
        env: { GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Promouvoir exactement le digest candidat
        shell: bash
        run: |
          . ./scripts/registry-helpers.sh
          digest=$(registry_resolve_digest_with_retry "${REGISTRY_IMAGE}:${CANDIDATE_TAG}")
          digest_promu=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }') || digest_promu=""
          if [ "$digest_promu" != "$digest" ]; then
            docker buildx imagetools create --prefer-index=false \
              --tag "${REGISTRY_IMAGE}:${VERSION}" "${REGISTRY_IMAGE}@${digest}"
          fi
          test "$(registry_resolve_digest_with_retry "${REGISTRY_IMAGE}:${VERSION}")" = "$digest"
